[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bagel-brkv-lifetime"
version = "0.1.0"
description = "Benefit-risk static conditioning-KV lifetime experiments for BAGEL-style unified multimodal models."
requires-python = ">=3.10"
dependencies = [
  "pyyaml",
]

[tool.setuptools.packages.find]
include = ["brkv*"]
